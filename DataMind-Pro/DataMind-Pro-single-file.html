<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataMind 商业数据分析师</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07090d;--panel:#0d1118;--panel-2:#111722;--panel-3:#151c29;--line:#223044;
  --text:#eef3fb;--muted:#8b98ab;--soft:#b7c3d6;--blue:#4f8cff;--cyan:#22d3ee;
  --green:#26c281;--amber:#f6b44b;--red:#ff5c7a;--violet:#9b7cff;--shadow:0 24px 80px rgba(0,0,0,.38);
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,"Microsoft YaHei",sans-serif;min-height:100vh;overflow:hidden}
button,input,select,textarea{font:inherit} button{cursor:pointer} ::selection{background:rgba(79,140,255,.35)}
.app{height:100vh;display:grid;grid-template-rows:64px 1fr;background:radial-gradient(circle at 18% -12%,rgba(79,140,255,.2),transparent 34%),radial-gradient(circle at 92% 0,rgba(34,211,238,.13),transparent 28%),var(--bg)}
.header{display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(7,9,13,.86);backdrop-filter:blur(18px)}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;color:white;font-weight:900;box-shadow:0 12px 34px rgba(79,140,255,.35)}
.brand{line-height:1}.brand strong{display:block;font-size:17px;letter-spacing:.01em}.brand span{font-size:12px;color:var(--muted)}
.file-pill{margin-left:auto;display:none;max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#cfe0ff;background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.28);padding:8px 12px;border-radius:999px;font-size:12px}
.header-actions{display:none;gap:8px}.icon-btn,.primary-btn,.ghost-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:8px;min-height:36px;padding:0 12px}.primary-btn{background:linear-gradient(135deg,var(--blue),#2fc9e8);border-color:transparent;color:white;font-weight:700}.ghost-btn{background:transparent;color:var(--soft)}
.main{min-height:0;display:grid;grid-template-columns:340px 1fr 380px}.sidebar,.workspace,.assistant{min-height:0;border-right:1px solid var(--line);background:rgba(13,17,24,.78);backdrop-filter:blur(14px)}.workspace{background:rgba(7,9,13,.36);overflow:auto}.assistant{border-right:none;display:flex;flex-direction:column}
.upload{grid-column:1/-1;display:grid;place-items:center;padding:36px}.drop{width:min(760px,92vw);border:1.5px dashed #34435b;background:linear-gradient(180deg,rgba(17,23,34,.88),rgba(13,17,24,.72));border-radius:18px;padding:46px;text-align:center;box-shadow:var(--shadow)}.drop.drag{border-color:var(--cyan);background:rgba(34,211,238,.08)}.drop-mark{width:72px;height:72px;margin:0 auto 20px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(79,140,255,.18),rgba(34,211,238,.13));font-size:30px}.drop h1{margin:0 0 10px;font-size:30px;letter-spacing:-.02em}.drop p{margin:0 auto 24px;color:var(--muted);max-width:560px;line-height:1.7}.drop small{display:block;margin-top:16px;color:#66758b}.hidden{display:none!important}
.side-section{padding:18px;border-bottom:1px solid var(--line)}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px}.kpi span{display:block;color:var(--muted);font-size:12px}.kpi strong{display:block;font-size:24px;margin-top:5px;letter-spacing:-.02em}.score-ring{height:126px;border-radius:12px;background:conic-gradient(var(--green) calc(var(--score)*1%),#243044 0);display:grid;place-items:center;position:relative}.score-ring:before{content:"";position:absolute;inset:12px;border-radius:10px;background:var(--panel)}.score-ring strong,.score-ring span{position:relative}.score-ring strong{font-size:32px}.score-ring span{color:var(--muted);font-size:12px}.field-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}.field{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);background:var(--panel-2);border-radius:9px}.field b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.field small{color:var(--muted)}.badge{padding:3px 7px;border-radius:999px;font-size:11px;border:1px solid}.num{color:var(--cyan);background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.28)}.cat{color:var(--amber);background:rgba(246,180,75,.08);border-color:rgba(246,180,75,.28)}.date{color:var(--violet);background:rgba(155,124,255,.09);border-color:rgba(155,124,255,.28)}
.tabs{position:sticky;top:0;z-index:4;display:flex;gap:6px;padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(7,9,13,.92);backdrop-filter:blur(16px)}.tab{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:8px;padding:9px 12px}.tab.active{background:var(--panel-2);border-color:var(--line);color:var(--text)}.view{padding:18px;display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.card h3{margin:0 0 10px;font-size:14px}.metric{font-size:28px;font-weight:800;letter-spacing:-.03em}.muted{color:var(--muted)}.insights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.insight{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;line-height:1.62}.insight strong{display:block;margin-bottom:4px}.insight.info{border-color:rgba(79,140,255,.38)}.insight.good{border-color:rgba(38,194,129,.38)}.insight.warn{border-color:rgba(246,180,75,.42)}.insight.risk{border-color:rgba(255,92,122,.42)}
.chart-shell{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.chart-title{font-weight:800}.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.chart-box{height:310px}.chart-box.small{height:250px}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.control label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.control select,.control input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 12px;border-bottom:1px solid #172132;text-align:left;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;background:#101723;color:#c7d2e5;z-index:1}.column-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.col-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.mini{background:var(--panel-2);border-radius:8px;padding:8px}.mini span{display:block;color:var(--muted);font-size:11px}.mini b{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{background:var(--panel-2);border:1px solid var(--line);color:var(--soft);border-radius:999px;padding:5px 8px;font-size:12px}.corr-table td:last-child{font-weight:800}.assistant-head{padding:16px 18px;border-bottom:1px solid var(--line)}.assistant-head strong{display:block}.assistant-head span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.messages{flex:1;overflow:auto;padding:16px}.msg{margin-bottom:12px}.bubble{padding:12px 13px;border-radius:12px;line-height:1.65;font-size:13px;white-space:pre-wrap}.msg.user{text-align:right}.msg.user .bubble{display:inline-block;text-align:left;background:var(--blue);color:white;max-width:92%}.msg.bot .bubble{background:var(--panel-2);border:1px solid var(--line);color:#dbe6f5}.quick{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px}.quick button{background:var(--panel-2);color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px}.chatbox{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}.chatbox textarea{flex:1;resize:none;max-height:120px;min-height:42px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;outline:none}.chatbox button{width:44px;border:none;border-radius:10px;background:var(--blue);color:white;font-weight:900}.empty{color:var(--muted);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:rgba(17,23,34,.5)}
@media (max-width:1180px){.main{grid-template-columns:300px 1fr}.assistant{display:none}.cards{grid-template-columns:repeat(2,1fr)}.chart-grid,.insights,.column-grid{grid-template-columns:1fr}.controls{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){body{overflow:auto}.app{height:auto;min-height:100vh}.main{display:block}.sidebar,.workspace,.assistant{display:block;border-right:none}.sidebar{border-bottom:1px solid var(--line)}.file-pill{max-width:48vw}.cards,.kpi-grid,.controls{grid-template-columns:1fr}.drop{padding:28px 18px}.drop h1{font-size:24px}}
.template-select{display:none;background:#111722;color:#eef3fb;border:1px solid #223044;border-radius:8px;padding:8px 10px;min-height:36px}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.three-col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.panel h3{margin:0 0 10px;font-size:14px}.pipeline{display:grid;gap:10px}.step{display:flex;gap:12px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px}.step i{display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:8px;background:rgba(79,140,255,.14);color:#cfe0ff;font-style:normal;font-weight:900}.step b{display:block}.step span{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.55}.finance-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.risk{color:var(--red);background:rgba(255,92,122,.09);border-color:rgba(255,92,122,.34)}.good{color:var(--green);background:rgba(38,194,129,.08);border-color:rgba(38,194,129,.28)}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">D</div><div class="brand"><strong>DataMind</strong><span>商业数据分析师 · 本地计算版</span></div>
    <select id="templateSelect" class="template-select"><option value="auto">自动识别模板</option><option value="sales">销售经营</option><option value="customer">客户增长</option><option value="finance">财务利润</option><option value="ops">运营效率</option><option value="investment">投资理财</option></select>
    <div id="filePill" class="file-pill"></div>
    <div id="headerActions" class="header-actions"><button id="exportBtn" class="ghost-btn">导出报告</button><button id="resetBtn" class="icon-btn">重置</button></div>
  </header>
  <main id="main" class="upload">
    <section id="uploadView" class="drop">
      <div class="drop-mark">⇧</div><h1>上传数据，立即得到商业分析仪表盘</h1>
      <p>支持 CSV、XLSX、XLS。所有统计、可视化、异常检测、相关性分析和问答都在浏览器本地完成，适合演示、内部分析和商业交付原型。</p>
      <button id="pickBtn" class="primary-btn">选择数据文件</button><input id="fileInput" type="file" accept=".csv,.xlsx,.xls" hidden>
      <small>建议文件第一行为字段名；大文件会自动限制部分图表采样，保证页面响应速度。</small>
    </section>
    <aside id="sidebar" class="sidebar hidden">
      <section class="side-section"><div class="section-title">数据质量</div><div id="qualityRing" class="score-ring" style="--score:0"><div><strong>0</strong><br><span>质量评分</span></div></div></section>
      <section class="side-section"><div class="section-title">核心指标</div><div id="kpis" class="kpi-grid"></div></section>
      <section class="side-section"><div class="section-title">字段清单 <span id="fieldCount"></span></div><div id="fieldList" class="field-list"></div></section>
    </aside>
    <section id="workspace" class="workspace hidden">
      <nav class="tabs"><button class="tab active" data-view="overview">总览</button><button class="tab" data-view="business">商业中心</button><button class="tab" data-view="automation">自动化</button><button class="tab" data-view="financeLab">理财</button><button class="tab" data-view="visuals">可视化</button><button class="tab" data-view="columns">字段分析</button><button class="tab" data-view="correlation">相关性</button><button class="tab" data-view="table">数据预览</button></nav>
      <section id="overview" class="view active"><div id="overviewCards" class="cards"></div><div id="insights" class="insights"></div><div class="chart-grid"><div class="chart-shell"><div class="chart-head"><span class="chart-title">关键分布</span></div><div class="chart-box small"><canvas id="autoChart1"></canvas></div></div><div class="chart-shell"><div class="chart-head"><span class="chart-title">趋势 / 序列</span></div><div class="chart-box small"><canvas id="autoChart2"></canvas></div></div></div></section>
      <section id="business" class="view"><div id="businessView"></div></section>
      <section id="automation" class="view"><div id="automationView"></div></section>
      <section id="financeLab" class="view"><div id="financeView"></div></section>
      <section id="visuals" class="view"><div class="chart-shell"><div class="controls"><div class="control"><label>图表类型</label><select id="chartType"><option value="bar">柱状图</option><option value="line">折线图</option><option value="scatter">散点图</option><option value="doughnut">环形图</option></select></div><div class="control"><label>X / 分类字段</label><select id="xField"></select></div><div class="control"><label>Y / 数值字段</label><select id="yField"></select></div><div class="control"><label>聚合方式</label><select id="aggMode"><option value="avg">平均值</option><option value="sum">求和</option><option value="count">计数</option><option value="min">最小值</option><option value="max">最大值</option></select></div></div><div class="chart-box"><canvas id="customChart"></canvas></div></div></section>
      <section id="columns" class="view"><div id="columnsGrid" class="column-grid"></div></section>
      <section id="correlation" class="view"><div id="corrView"></div></section>
      <section id="table" class="view"><div id="tableView"></div></section>
    </section>
    <aside id="assistant" class="assistant hidden"><div class="assistant-head"><strong>本地分析助手</strong><span>支持商业、自动化和理财问题</span></div><div id="messages" class="messages"></div><div class="quick"><button>生成完整商业报告</button><button>给我自动化建议</button><button>找经营风险</button><button>生成理财建议</button></div><div class="chatbox"><textarea id="askInput" placeholder="问：利润率怎么样？有哪些预警？资产配置怎么调？" rows="1"></textarea><button id="askBtn">↑</button></div></aside>
  </main>
</div>
<script>
const COLORS=["#4f8cff","#22d3ee","#26c281","#f6b44b","#ff5c7a","#9b7cff","#e879f9","#14b8a6","#f97316","#84cc16"];
let rows=[], columns=[], profile={}, insights=[], charts=[], biz={}, rules=[];
const $=id=>document.getElementById(id);
window.addEventListener("error",e=>{const main=document.getElementById("main");if(main){main.className="upload";main.innerHTML=`<section class="drop"><h1>DataMind 启动失败</h1><p>${String(e.message||e.error||"未知错误")}</p><button class="primary-btn" onclick="location.reload()">重新加载</button></section>`}});
const fmt=n=>Number.isFinite(n)?Math.abs(n)>=1000?n.toLocaleString(undefined,{maximumFractionDigits:2}):Number(n.toFixed(2)).toString():"-";
const clean=v=>v===null||v===undefined?"":String(v).trim();
const isMissing=v=>clean(v)===""||["null","undefined","nan","n/a","na","-"].includes(clean(v).toLowerCase());
const toNum=v=>{if(isMissing(v))return NaN; const n=Number(String(v).replace(/,/g,"")); return Number.isFinite(n)?n:NaN};
const median=a=>{const s=a.filter(Number.isFinite).sort((x,y)=>x-y); if(!s.length)return NaN; const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2};
const quantile=(a,q)=>{const s=a.filter(Number.isFinite).sort((x,y)=>x-y); if(!s.length)return NaN; const p=(s.length-1)*q,b=Math.floor(p),r=p-b; return s[b+1]!==undefined?s[b]+r*(s[b+1]-s[b]):s[b]};
const escapeHtml=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function destroyCharts(){charts.forEach(c=>c.destroy());charts=[]}
function makeChart(id,type,data,options={}){const el=$(id); if(!el)return; if(!window.Chart){const box=el.parentElement;if(box)box.innerHTML='<div class="empty">图表库未加载，数据分析仍可使用。请联网后刷新可显示图表。</div>';return} try{charts.push(new Chart(el,{type,data,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:"#b7c3d6",boxWidth:10},...options.legend}},scales:type==="doughnut"?undefined:{x:{grid:{color:"#1d293b"},ticks:{color:"#8b98ab",maxRotation:0,autoSkip:true}},y:{grid:{color:"#1d293b"},ticks:{color:"#8b98ab"}}},animation:false,...options}}))}catch(err){console.warn(err)}}
$("pickBtn").onclick=()=>$("fileInput").click(); $("fileInput").onchange=e=>handleFile(e.target.files[0]);
["dragover","drop"].forEach(evt=>$("uploadView").addEventListener(evt,e=>e.preventDefault()));
$("uploadView").addEventListener("dragover",()=>$("uploadView").classList.add("drag")); $("uploadView").addEventListener("dragleave",()=>$("uploadView").classList.remove("drag"));
$("uploadView").addEventListener("drop",e=>{ $("uploadView").classList.remove("drag"); handleFile(e.dataTransfer.files[0]) });
$("resetBtn").onclick=()=>location.reload(); $("exportBtn").onclick=exportReport;
document.getElementById('templateSelect').onchange=()=>{ biz=buildBusiness(); rules=buildRules(); insights=buildInsights(); renderAll(); };
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showView(b.dataset.view));
document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>answerQuestion(b.textContent));
$("askBtn").onclick=()=>{const q=$("askInput").value.trim(); if(q){$("askInput").value=""; answerQuestion(q)}};
$("askInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("askBtn").click()}});
["chartType","xField","yField","aggMode"].forEach(id=>$(id).addEventListener("change",renderCustomChart));
function parseCsvText(text){const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const split=line=>{const out=[];let cur="",q=false;for(let i=0;i<line.length;i++){const ch=line[i],nx=line[i+1];if(ch==='"'&&q&&nx==='"'){cur+='"';i++}else if(ch==='"')q=!q;else if(ch===","&&!q){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out.map(v=>v.trim())};const heads=split(lines[0]);return lines.slice(1).map(line=>{const vals=split(line),r={};heads.forEach((h,i)=>r[h||`字段${i+1}`]=vals[i]??"");return r})}
function handleFile(file){if(!file)return; const name=file.name; if(/\.csv$/i.test(name)){if(window.Papa){Papa.parse(file,{header:true,skipEmptyLines:true,dynamicTyping:false,complete:r=>boot(r.data,name),error:e=>alert(e.message)})}else{const rd=new FileReader();rd.onload=e=>boot(parseCsvText(e.target.result),name);rd.readAsText(file,"utf-8")}}else{if(!window.XLSX){alert("Excel 解析库未加载。请联网刷新，或先另存为 CSV 再上传。");return}const rd=new FileReader(); rd.onload=e=>{const wb=XLSX.read(e.target.result,{type:"array"}); const ws=wb.Sheets[wb.SheetNames[0]]; boot(XLSX.utils.sheet_to_json(ws,{defval:""}),name)}; rd.readAsArrayBuffer(file)}}
function boot(data,name){rows=data.filter(r=>Object.values(r).some(v=>!isMissing(v))); columns=Object.keys(rows[0]||{}); if(!rows.length){alert("没有读取到有效数据");return} profile=buildProfile(rows,columns); biz=buildBusiness(); rules=buildRules(); insights=buildInsights(); $("main").className="main"; ["uploadView"].forEach(id=>$(id).classList.add("hidden")); ["sidebar","workspace","assistant"].forEach(id=>$(id).classList.remove("hidden")); $("headerActions").style.display="flex"; $("templateSelect").style.display="block"; $("filePill").style.display="block"; $("filePill").textContent=name; renderAll(); addMsg("bot",`已加载 ${name}\n共 ${rows.length.toLocaleString()} 行、${columns.length} 列。我已经完成自动化流水线：字段识别、商业 KPI、经营预警、异常值、相关性、分组贡献和理财模块初始化。`) }
function buildProfile(data,cols){const p={columns:{},num:[],cat:[],date:[],missingCells:0,duplicates:0}; const seen=new Set(); data.forEach(r=>{const sig=JSON.stringify(r); if(seen.has(sig))p.duplicates++; seen.add(sig)}); cols.forEach(col=>{const vals=data.map(r=>r[col]); const missing=vals.filter(isMissing).length; p.missingCells+=missing; const present=vals.filter(v=>!isMissing(v)); const nums=present.map(toNum).filter(Number.isFinite); const dates=present.map(v=>Date.parse(v)).filter(Number.isFinite); let type="category"; if(present.length&&nums.length/present.length>=.75)type="number"; else if(present.length&&dates.length/present.length>=.75)type="date"; const unique=new Set(present.map(clean)).size; const common=Object.entries(present.reduce((a,v)=>{const k=clean(v)||"空值";a[k]=(a[k]||0)+1;return a},{})).sort((a,b)=>b[1]-a[1]).slice(0,8); const item={name:col,type,missing,missingRate:missing/data.length,unique,common}; if(type==="number"){const q1=quantile(nums,.25),q3=quantile(nums,.75),iqr=q3-q1,lo=q1-1.5*iqr,hi=q3+1.5*iqr,out=nums.filter(v=>v<lo||v>hi); const mean=nums.reduce((a,b)=>a+b,0)/(nums.length||1); const sd=Math.sqrt(nums.reduce((a,b)=>a+(b-mean)**2,0)/(nums.length||1)); Object.assign(item,{count:nums.length,min:Math.min(...nums),max:Math.max(...nums),mean,median:median(nums),q1,q3,sd,outliers:out.length,outlierRate:out.length/(nums.length||1),values:nums}) ; p.num.push(col)} else if(type==="date"){const ds=dates.sort((a,b)=>a-b); Object.assign(item,{start:new Date(ds[0]),end:new Date(ds[ds.length-1])}); p.date.push(col)} else p.cat.push(col); p.columns[col]=item}); const total=data.length*cols.length; p.quality=Math.max(0,Math.round(100-(p.missingCells/Math.max(total,1))*45-(p.duplicates/Math.max(data.length,1))*25-(Object.values(p.columns).reduce((a,c)=>a+(c.outlierRate||0),0)/Math.max(p.num.length,1))*18)); p.corr=correlations(p); return p}
function correlations(p){const pairs=[]; for(let i=0;i<p.num.length;i++)for(let j=i+1;j<p.num.length;j++){const a=p.num[i],b=p.num[j]; const xs=[],ys=[]; rows.forEach(r=>{const x=toNum(r[a]),y=toNum(r[b]); if(Number.isFinite(x)&&Number.isFinite(y)){xs.push(x);ys.push(y)}}); if(xs.length>2){const mx=xs.reduce((s,v)=>s+v,0)/xs.length,my=ys.reduce((s,v)=>s+v,0)/ys.length; const num=xs.reduce((s,x,k)=>s+(x-mx)*(ys[k]-my),0); const den=Math.sqrt(xs.reduce((s,x)=>s+(x-mx)**2,0)*ys.reduce((s,y)=>s+(y-my)**2,0)); const r=den?num/den:0; pairs.push({a,b,r,n:xs.length})}} return pairs.sort((x,y)=>Math.abs(y.r)-Math.abs(x.r)).slice(0,30)}
function findCol(words,type){const pool=columns.filter(c=>!type||profile.columns[c].type===type);return pool.find(c=>words.some(w=>c.toLowerCase().includes(w)||c.includes(w)))}
function templateName(t){return {sales:"销售经营",customer:"客户增长",finance:"财务利润",ops:"运营效率",investment:"投资理财",auto:"自动识别"}[t]||t}
function calcGrowth(dateCol,numCol){if(!dateCol||!numCol)return NaN;const pts=rows.map(r=>({t:Date.parse(r[dateCol]),v:toNum(r[numCol])})).filter(p=>Number.isFinite(p.t)&&Number.isFinite(p.v)).sort((a,b)=>a.t-b.t);if(pts.length<4)return NaN;const mid=Math.floor(pts.length/2),a=pts.slice(0,mid).reduce((s,p)=>s+p.v,0)/mid,b=pts.slice(mid).reduce((s,p)=>s+p.v,0)/(pts.length-mid);return a?b/a-1:NaN}
function groupBy(cat,num){if(!cat)return[];const map=new Map();rows.forEach(r=>{const k=clean(r[cat])||"空值",v=num?toNum(r[num]):1;if(!map.has(k))map.set(k,{sum:0,count:0});const o=map.get(k);o.count++;if(Number.isFinite(v))o.sum+=v});return[...map.entries()].map(([k,o])=>({k,sum:o.sum,count:o.count,avg:o.sum/Math.max(o.count,1)})).sort((a,b)=>(b.sum||b.count)-(a.sum||a.count))}
function buildBusiness(){const selected=$("templateSelect")?.value||"auto";const revenue=findCol(["revenue","sales","amount","收入","销售","销售额","营业额","金额","成交"],"number")||profile.num[0];const cost=findCol(["cost","成本","费用","支出"],"number");const profit=findCol(["profit","利润","毛利","收益"],"number");const orders=findCol(["order","订单","销量","数量","件数"],"number");const customer=findCol(["customer","客户","用户","会员","client"],null);const channel=findCol(["channel","渠道","来源","平台"],"category")||profile.cat[0];const region=findCol(["region","地区","城市","省份","区域"],"category");const date=profile.date[0]||findCol(["date","日期","时间","月份"],null);const revSum=revenue?profile.columns[revenue].values.reduce((a,b)=>a+b,0):NaN;const costSum=cost?profile.columns[cost].values.reduce((a,b)=>a+b,0):NaN;const profitSum=profit?profile.columns[profit].values.reduce((a,b)=>a+b,0):(Number.isFinite(revSum)&&Number.isFinite(costSum)?revSum-costSum:NaN);const margin=Number.isFinite(profitSum)&&Number.isFinite(revSum)&&revSum!==0?profitSum/revSum:NaN;const orderSum=orders?profile.columns[orders].values.reduce((a,b)=>a+b,0):rows.length;const aov=Number.isFinite(revSum)&&orderSum?revSum/orderSum:NaN;const growth=calcGrowth(date,revenue);let health=profile.quality;if(Number.isFinite(margin))health+=Math.max(-15,Math.min(15,(margin-.18)*55));if(Number.isFinite(growth))health+=Math.max(-12,Math.min(12,growth*42));health=Math.max(0,Math.min(100,Math.round(health)));const guessed=revenue&&cost?"finance":customer&&orders?"customer":revenue&&channel?"sales":"ops";return{template:selected==="auto"?guessed:selected,revenue,cost,profit,orders,customer,channel,region,date,revSum,costSum,profitSum,margin,orderSum,aov,growth,health}}
function buildRules(){const rs=[];Object.values(profile.columns).filter(c=>c.missingRate>.1).sort((a,b)=>b.missingRate-a.missingRate).slice(0,4).forEach(c=>rs.push({level:"高",name:"缺失率预警",target:c.name,detail:`缺失率 ${(c.missingRate*100).toFixed(1)}%，超过 10%`,action:"补齐、设默认值或从关键报表剔除"}));Object.values(profile.columns).filter(c=>c.outlierRate>.05).sort((a,b)=>b.outlierRate-a.outlierRate).slice(0,4).forEach(c=>rs.push({level:"中",name:"异常值预警",target:c.name,detail:`IQR 异常 ${c.outliers} 个，占 ${(c.outlierRate*100).toFixed(1)}%`,action:"复核极端值来源，设置业务上限或标记"}));if(profile.duplicates>0)rs.push({level:"中",name:"重复行预警",target:"全表",detail:`发现 ${profile.duplicates} 行重复`,action:"按订单号/客户ID/日期组合去重"});if(Number.isFinite(biz.margin)&&biz.margin<.15)rs.push({level:"高",name:"利润率预警",target:biz.profit||biz.revenue,detail:`利润率 ${(biz.margin*100).toFixed(1)}%，低于 15%`,action:"检查成本、折扣、渠道结构和低毛利业务"});if(Number.isFinite(biz.growth)&&biz.growth<-.1)rs.push({level:"高",name:"增长下滑预警",target:biz.revenue,detail:`后半期较前半期变化 ${(biz.growth*100).toFixed(1)}%`,action:"按渠道、地区、客户定位下滑来源"});return rs.length?rs:[{level:"低",name:"运行正常",target:"全表",detail:"未触发默认高风险规则",action:"可继续添加业务阈值监控"}]}
function buildInsights(){const out=[]; out.push({t:"自动化流水线完成",k:"info",d:`已完成字段识别、数据质量、商业 KPI、规则预警、异常检测、相关性和分组贡献分析。当前模板：${templateName(biz.template)}。`}); out.push({t:"经营健康度",k:biz.health>=82?"good":biz.health>=65?"warn":"risk",d:`综合评分 ${biz.health}/100，融合数据质量、利润率和增长趋势。`}); if(Number.isFinite(biz.revSum))out.push({t:"收入规模",k:"info",d:`识别 ${biz.revenue} 为收入字段，总额 ¥${biz.revSum.toLocaleString(undefined,{maximumFractionDigits:0})}，单均值约 ¥${fmt(biz.aov)}。`}); if(Number.isFinite(biz.margin))out.push({t:"利润能力",k:biz.margin>=.25?"good":biz.margin>=.12?"warn":"risk",d:`利润约 ¥${biz.profitSum.toLocaleString(undefined,{maximumFractionDigits:0})}，利润率 ${(biz.margin*100).toFixed(1)}%。`}); if(rules.some(r=>r.level==="高"))out.push({t:"高优先级预警",k:"risk",d:`当前触发 ${rules.filter(r=>r.level==="高").length} 条高优先级规则，应先处理。`}); if(profile.corr[0]&&Math.abs(profile.corr[0].r)>=.65)out.push({t:"强相关关系",k:"info",d:`${profile.corr[0].a} 与 ${profile.corr[0].b} 的相关系数为 ${fmt(profile.corr[0].r)}，可做驱动因素分析。`}); return out}

function renderOverview(){const missingRate=profile.missingCells/Math.max(rows.length*columns.length,1)*100; $("overviewCards").innerHTML=`<div class="card"><h3>经营健康度</h3><div class="metric">${biz.health}</div><div class="muted">数据 + 盈利 + 增长</div></div><div class="card"><h3>收入规模</h3><div class="metric">${Number.isFinite(biz.revSum)?'¥'+biz.revSum.toLocaleString(undefined,{maximumFractionDigits:0}):'-'}</div><div class="muted">字段：${biz.revenue||'未识别'}</div></div><div class="card"><h3>缺失率</h3><div class="metric">${fmt(missingRate)}%</div><div class="muted">${profile.missingCells.toLocaleString()} 个空值</div></div><div class="card"><h3>自动预警</h3><div class="metric">${rules.length}</div><div class="muted">规则引擎结果</div></div>`; $("insights").innerHTML=insights.map(i=>`<div class="insight ${i.k}"><strong>${escapeHtml(i.t)}</strong>${escapeHtml(i.d)}</div>`).join(""); renderAutoCharts()}

function renderBusiness(){const cat=biz.channel||profile.cat[0],num=biz.revenue||profile.num[0],top=groupBy(cat,num).slice(0,8),total=top.reduce((s,x)=>s+(x.sum||x.count),0);let cum=0;const rowsHtml=top.map(x=>{cum+=(x.sum||x.count);return `<tr><td>${escapeHtml(x.k)}</td><td>${Number.isFinite(x.sum)?'¥'+x.sum.toLocaleString(undefined,{maximumFractionDigits:0}):x.count}</td><td>${total?((cum/total)*100).toFixed(1):0}%</td></tr>`}).join(""); $("businessView").innerHTML=`<div class="cards"><div class="card"><h3>分析模板</h3><div class="metric">${templateName(biz.template)}</div><div class="muted">顶部可切换</div></div><div class="card"><h3>利润</h3><div class="metric">${Number.isFinite(biz.profitSum)?'¥'+biz.profitSum.toLocaleString(undefined,{maximumFractionDigits:0}):'-'}</div><div class="muted">利润率 ${Number.isFinite(biz.margin)?(biz.margin*100).toFixed(1)+'%':'-'}</div></div><div class="card"><h3>增长</h3><div class="metric">${Number.isFinite(biz.growth)?(biz.growth*100).toFixed(1)+'%':'-'}</div><div class="muted">前后半期对比</div></div><div class="card"><h3>单均值</h3><div class="metric">${Number.isFinite(biz.aov)?'¥'+fmt(biz.aov):'-'}</div><div class="muted">收入 ÷ 订单/记录</div></div></div><div class="chart-grid"><div class="chart-shell"><div class="chart-head"><span class="chart-title">维度贡献排名</span></div><div class="chart-box"><canvas id="bizRankChart"></canvas></div></div><div class="chart-shell"><div class="chart-head"><span class="chart-title">帕累托贡献</span></div><div class="table-wrap"><table><thead><tr><th>维度</th><th>贡献</th><th>累计占比</th></tr></thead><tbody>${rowsHtml}</tbody></table></div></div></div><div class="insights">${businessActions().map(i=>`<div class="insight ${i.k}"><strong>${i.t}</strong>${i.d}</div>`).join("")}</div>`; makeChart("bizRankChart","bar",{labels:top.map(x=>String(x.k).slice(0,16)),datasets:[{label:num||"贡献",data:top.map(x=>x.sum||x.count),backgroundColor:"#4f8cff",borderRadius:6}]})}

function cleaningTasks(){const tasks=[];const miss=Object.values(profile.columns).sort((a,b)=>b.missingRate-a.missingRate)[0];if(miss&&miss.missing>0)tasks.push({t:"缺失值处理",d:`优先处理 ${miss.name}，缺失率 ${(miss.missingRate*100).toFixed(1)}%。`});if(profile.duplicates)tasks.push({t:"去重",d:`检测到 ${profile.duplicates} 行重复，建议按订单号/客户ID/日期组合去重。`});const out=Object.values(profile.columns).filter(c=>c.outliers>0).sort((a,b)=>b.outliers-a.outliers)[0];if(out)tasks.push({t:"异常值复核",d:`${out.name} 有 ${out.outliers} 个异常点，建议标记而不是直接删除。`});if(biz.revenue&&biz.cost&&!biz.profit)tasks.push({t:"派生字段",d:`可新增 利润 = ${biz.revenue} - ${biz.cost}，并计算利润率。`});tasks.push({t:"自动监控",d:"把高优先级规则保存为日报/周报检查项。"});return tasks}
function renderAutomation(){const pipeline=["字段角色识别","数据质量评分","商业 KPI 计算","异常与规则预警","相关性与贡献分析","报告生成"];const desc=["自动判断数值、日期、类别、收入、成本、客户、渠道等字段。","融合缺失、重复、异常和字段完整度生成评分。","计算收入、成本、利润、利润率、订单、单均值、增长。","按默认商业规则发现缺失、异常、利润率、增长风险。","输出 Top 贡献、帕累托、强相关字段和驱动线索。","生成可复制、可导出的商业与理财分析报告。"];const ruleRows=rules.map(r=>`<tr><td><span class="badge ${r.level==='高'?'risk':r.level==='中'?'num':'good'}">${r.level}</span></td><td>${r.name}</td><td>${escapeHtml(r.target||"")}</td><td>${escapeHtml(r.detail)}</td><td>${escapeHtml(r.action)}</td></tr>`).join(""); $("automationView").innerHTML=`<div class="two-col"><div class="panel"><h3>自动分析流水线</h3><div class="pipeline">${pipeline.map((s,i)=>`<div class="step"><i>${i+1}</i><div><b>${s}</b><span>${desc[i]}</span></div></div>`).join("")}</div></div><div class="panel"><h3>数据处理建议</h3><div class="pipeline">${cleaningTasks().map((t,i)=>`<div class="step"><i>${i+1}</i><div><b>${t.t}</b><span>${t.d}</span></div></div>`).join("")}</div></div></div><div class="chart-shell"><div class="chart-head"><span class="chart-title">规则预警引擎</span></div><div class="table-wrap"><table><thead><tr><th>级别</th><th>规则</th><th>对象</th><th>触发原因</th><th>建议动作</th></tr></thead><tbody>${ruleRows}</tbody></table></div></div>`}
function renderFinance(){ $("financeView").innerHTML=`<div class="panel"><h3>理财规划器</h3><div class="finance-form"><div class="control"><label>初始本金</label><input id="fiPrincipal" type="number" value="100000"></div><div class="control"><label>每月投入</label><input id="fiMonthly" type="number" value="3000"></div><div class="control"><label>年化收益率 %</label><input id="fiRate" type="number" value="6"></div><div class="control"><label>年限</label><input id="fiYears" type="number" value="15"></div></div><div class="finance-result" id="financeResult"></div></div><div class="chart-grid"><div class="chart-shell"><div class="chart-head"><span class="chart-title">财富增长曲线</span></div><div class="chart-box"><canvas id="wealthChart"></canvas></div></div><div class="chart-shell"><div class="chart-head"><span class="chart-title">投资/预算数据识别</span></div><div id="investDataBox"></div></div></div>`; ["fiPrincipal","fiMonthly","fiRate","fiYears"].forEach(id=>$(id).addEventListener("input",calcFinance)); calcFinance(); renderInvestmentData()}
function calcFinance(){if(!$("fiPrincipal"))return;const p=toNum($("fiPrincipal").value),m=toNum($("fiMonthly").value),rate=toNum($("fiRate").value)/100/12,years=toNum($("fiYears").value);let bal=p,labels=[],vals=[];for(let y=1;y<=years;y++){for(let i=0;i<12;i++)bal=bal*(1+rate)+m;labels.push("第"+y+"年");vals.push(Math.round(bal))}const invested=p+m*12*years,gain=bal-invested; $("financeResult").innerHTML=`<div class="kpi"><span>预计资产</span><strong>¥${bal.toLocaleString(undefined,{maximumFractionDigits:0})}</strong></div><div class="kpi"><span>累计投入</span><strong>¥${invested.toLocaleString(undefined,{maximumFractionDigits:0})}</strong></div><div class="kpi"><span>投资收益</span><strong>¥${gain.toLocaleString(undefined,{maximumFractionDigits:0})}</strong></div><div class="kpi"><span>贷款参考</span><strong>¥${monthlyPayment(1000000,.042,30).toLocaleString(undefined,{maximumFractionDigits:0})}/月</strong></div>`; makeChart("wealthChart","line",{labels,datasets:[{label:"资产",data:vals,borderColor:"#10b981",backgroundColor:"rgba(16,185,129,.12)",fill:true,pointRadius:0,tension:.25}]})}
function monthlyPayment(principal,annual,years){const r=annual/12,n=years*12;return principal*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)}
function renderInvestmentData(){const amount=findCol(["amount","金额","资产","市值","余额","收入","支出"],"number")||biz.revenue;const type=findCol(["type","类别","资产类别","科目","产品"],"category")||profile.cat[0];if(!amount){$("investDataBox").innerHTML='<div class="empty">上传包含金额/资产/市值字段的数据后，可自动生成预算或投资组合分析。</div>';return}const items=groupBy(type,amount).slice(0,8),total=items.reduce((s,i)=>s+i.sum,0);$("investDataBox").innerHTML=`<div class="table-wrap"><table><thead><tr><th>类别</th><th>金额</th><th>占比</th></tr></thead><tbody>${items.map(x=>`<tr><td>${escapeHtml(x.k)}</td><td>¥${x.sum.toLocaleString(undefined,{maximumFractionDigits:0})}</td><td>${total?((x.sum/total)*100).toFixed(1):0}%</td></tr>`).join("")}</tbody></table></div><p class="muted" style="margin-top:10px">可用于家庭预算、资产配置或投资组合集中度检查。</p>`}
function renderSelectors(){const all=columns; const nums=profile.num; $("xField").innerHTML=all.map(c=>`<option>${escapeHtml(c)}</option>`).join(""); $("yField").innerHTML=(nums.length?nums:all).map(c=>`<option>${escapeHtml(c)}</option>`).join(""); if(profile.cat[0])$("xField").value=profile.cat[0]; if(profile.num[0])$("yField").value=profile.num[0]}
function aggregate(x,y,mode){const map=new Map(); rows.forEach(r=>{const key=clean(r[x])||"空值"; const val=toNum(r[y]); if(!map.has(key))map.set(key,{sum:0,count:0,min:Infinity,max:-Infinity}); const o=map.get(key); o.count++; if(Number.isFinite(val)){o.sum+=val;o.min=Math.min(o.min,val);o.max=Math.max(o.max,val)}}); return [...map.entries()].map(([k,o])=>({k,v:mode==="count"?o.count:mode==="sum"?o.sum:mode==="min"?o.min:mode==="max"?o.max:o.sum/Math.max(o.count,1)})).filter(d=>Number.isFinite(d.v)).sort((a,b)=>b.v-a.v).slice(0,20)}
function renderCustomChart(){const old=charts.find(c=>c.canvas.id==="customChart"); if(old){old.destroy(); charts=charts.filter(c=>c!==old)} const type=$("chartType").value,x=$("xField").value,y=$("yField").value,mode=$("aggMode").value; let data; if(type==="scatter"){const pts=rows.slice(0,800).map(r=>({x:toNum(r[x]),y:toNum(r[y])})).filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)); data={datasets:[{label:`${y} vs ${x}`,data:pts,backgroundColor:"rgba(79,140,255,.62)",pointRadius:3}]}} else if(type==="line"&&profile.columns[x]?.type==="number"){const pts=rows.slice(0,500).map(r=>({x:toNum(r[x]),y:toNum(r[y])})).filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)).sort((a,b)=>a.x-b.x); data={datasets:[{label:y,data:pts,borderColor:"#22d3ee",pointRadius:0,tension:.25}]}} else {const items=aggregate(x,y,mode); data={labels:items.map(d=>String(d.k).slice(0,24)),datasets:[{label:mode==="count"?"计数":y,data:items.map(d=>d.v),backgroundColor:type==="doughnut"?COLORS:"#4f8cff",borderRadius:6,borderWidth:0}]}} makeChart("customChart",type,data,{legend:{position:type==="doughnut"?"bottom":"top"}})}
function renderColumns(){ $("columnsGrid").innerHTML=columns.map(c=>{const f=profile.columns[c]; const typeLabel=f.type==="number"?"数值":f.type==="date"?"日期":"类别"; const body=f.type==="number"?`<div class="mini-stats"><div class="mini"><span>最小</span><b>${fmt(f.min)}</b></div><div class="mini"><span>最大</span><b>${fmt(f.max)}</b></div><div class="mini"><span>均值</span><b>${fmt(f.mean)}</b></div><div class="mini"><span>中位数</span><b>${fmt(f.median)}</b></div><div class="mini"><span>标准差</span><b>${fmt(f.sd)}</b></div><div class="mini"><span>异常值</span><b>${f.outliers}</b></div></div>`:f.type==="date"?`<div class="mini-stats"><div class="mini"><span>开始</span><b>${f.start.toLocaleDateString()}</b></div><div class="mini"><span>结束</span><b>${f.end.toLocaleDateString()}</b></div><div class="mini"><span>唯一值</span><b>${f.unique}</b></div></div>`:`<div class="tags">${f.common.map(x=>`<span class="tag">${escapeHtml(String(x[0]).slice(0,24))} · ${x[1]}</span>`).join("")}</div>`; return `<div class="col-card"><h3>${escapeHtml(c)} <span class="badge ${f.type==="number"?"num":f.type==="date"?"date":"cat"}">${typeLabel}</span></h3><div class="muted">缺失 ${f.missing} · 唯一值 ${f.unique}</div>${body}</div>`}).join("")}
function renderCorrelation(){if(profile.num.length<2){$("corrView").innerHTML='<div class="empty">至少需要两个数值字段才能计算相关性。</div>';return} const rowsHtml=profile.corr.map(p=>`<tr><td>${escapeHtml(p.a)}</td><td>${escapeHtml(p.b)}</td><td style="color:${Math.abs(p.r)>=.65?'#26c281':'#b7c3d6'}">${fmt(p.r)}</td><td>${p.n}</td></tr>`).join(""); $("corrView").innerHTML=`<div class="table-wrap"><table class="corr-table"><thead><tr><th>字段 A</th><th>字段 B</th><th>相关系数</th><th>样本数</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`}
function renderTable(){const sample=rows.slice(0,150); $("tableView").innerHTML=`<div class="table-wrap"><table><thead><tr>${columns.map(c=>`<th>${escapeHtml(c)}</th>`).join("")}</tr></thead><tbody>${sample.map(r=>`<tr>${columns.map(c=>`<td title="${escapeHtml(clean(r[c]))}">${escapeHtml(clean(r[c])).slice(0,80)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="muted" style="padding:10px 2px">显示前 ${sample.length} 行，共 ${rows.length.toLocaleString()} 行。</p>`}
function showView(id){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.view===id)); document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===id)); if(id==="business")renderBusiness(); if(id==="visuals")renderCustomChart(); if(id==="financeLab")calcFinance()}
function addMsg(role,text){const div=document.createElement("div"); div.className=`msg ${role}`; div.innerHTML=`<div class="bubble">${escapeHtml(text)}</div>`; $("messages").appendChild(div); $("messages").scrollTop=$("messages").scrollHeight}
function answerQuestion(q){addMsg("user",q); let a=""; if(q.includes("理财")||q.includes("投资")||q.includes("资产"))a="理财建议：\n- 先建立 6-12 个月现金储备，再做长期投资。\n- 使用理财页复利规划器测算每月投入、收益率和期限。\n- 若数据包含资产类别和金额，系统会自动输出资产配置占比。\n- 控制单一资产集中度，避免高波动资产占比过高。"; else if(q.includes("自动"))a="自动化建议：\n"+cleaningTasks().map(t=>`- ${t.t}: ${t.d}`).join("\n")+`\n- 当前 ${rules.length} 条规则可作为日报/周报监控清单。`; else if(q.includes("风险")||q.includes("预警"))a=rules.map(r=>`- [${r.level}] ${r.name}: ${r.detail}；建议：${r.action}`).join("\n"); else if(q.includes("报告")||q.includes("完整"))a=reportText(); else if(q.includes("利润")||q.includes("商业"))a=`商业摘要：\n- 收入：${Number.isFinite(biz.revSum)?'¥'+biz.revSum.toLocaleString(undefined,{maximumFractionDigits:0}):'-'}\n- 利润：${Number.isFinite(biz.profitSum)?'¥'+biz.profitSum.toLocaleString(undefined,{maximumFractionDigits:0}):'-'}\n- 利润率：${Number.isFinite(biz.margin)?(biz.margin*100).toFixed(1)+'%':'-'}\n- 增长：${Number.isFinite(biz.growth)?(biz.growth*100).toFixed(1)+'%':'-'}\n- 健康度：${biz.health}/100`; else a="主要洞察：\n"+insights.map(i=>`- ${i.t}: ${i.d}`).join("\n"); addMsg("bot",a)}
function reportText(){return `DataMind Pro 商业与理财分析报告\n\n一、数据概况\n- 行数：${rows.length.toLocaleString()}\n- 列数：${columns.length}\n- 数值字段：${profile.num.length}\n- 类别字段：${profile.cat.length}\n- 日期字段：${profile.date.length}\n- 当前模板：${templateName(biz.template)}\n\n二、商业 KPI\n- 经营健康度：${biz.health}/100\n- 收入：${Number.isFinite(biz.revSum)?'¥'+biz.revSum.toLocaleString(undefined,{maximumFractionDigits:0}):'-'}\n- 成本：${Number.isFinite(biz.costSum)?'¥'+biz.costSum.toLocaleString(undefined,{maximumFractionDigits:0}):'-'}\n- 利润：${Number.isFinite(biz.profitSum)?'¥'+biz.profitSum.toLocaleString(undefined,{maximumFractionDigits:0}):'-'}\n- 利润率：${Number.isFinite(biz.margin)?(biz.margin*100).toFixed(1)+'%':'-'}\n- 订单/记录：${fmt(biz.orderSum)}\n- 单均值：${Number.isFinite(biz.aov)?'¥'+fmt(biz.aov):'-'}\n- 增长趋势：${Number.isFinite(biz.growth)?(biz.growth*100).toFixed(1)+'%':'-'}\n\n三、关键洞察\n${insights.map(i=>`- ${i.t}: ${i.d}`).join("\n")}\n\n四、自动化预警\n${rules.map(r=>`- [${r.level}] ${r.name} / ${r.target}: ${r.detail}。建议：${r.action}`).join("\n")}\n\n五、数据处理建议\n${cleaningTasks().map(t=>`- ${t.t}: ${t.d}`).join("\n")}\n\n六、理财与投资模块\n- 复利规划器可测算本金、月投、年化收益和期限。\n- 贷款参考可估算月供压力。\n- 若上传资产/预算/投资数据，可自动识别金额和类别，输出配置占比。\n\n七、下一步动作\n- 将高优先级规则纳入日常监控。\n- 对 Top 贡献维度做渠道、地区、客户或产品下钻。\n- 对低利润或负增长业务线建立专项改善计划。\n- 对理财数据建立现金流、资产配置和风险承受能力三张表。`}
function exportReport(){const blob=new Blob([reportText()],{type:"text/plain;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="DataMind-Pro商业理财分析报告.txt"; a.click(); URL.revokeObjectURL(a.href)}
</script>
